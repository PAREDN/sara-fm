# Runs the offline test suite and the test-vector check on every push and
# pull request, on Windows (where the gateways run) and Linux.
name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux packages (PortAudio, Tk display)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev xvfb
      - run: python -m pip install numpy scipy pyaudio pyserial hidapi
      - name: Test vectors
        run: python test-vectors/verify.py
      - name: Offline tests (Windows)
        if: runner.os == 'Windows'
        run: python test_offline.py
      - name: Offline tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python test_offline.py
