<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/><text x="24" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1d2430">One key-up: tone, up to 8 frames separated by tone, tone</text><text x="24" y="56" text-anchor="start" font-size="11.5" fill="#5b6472">Transmission (PTT on to PTT off)</text><rect x="24" y="72" width="128" height="40" rx="6" fill="#eef1f5" stroke="#8a8f98" stroke-width="1.25"/><text x="88" y="97" text-anchor="middle" font-size="13" fill="#1d2430">Lead-in tone</text><rect x="152" y="72" width="232" height="40" rx="6" fill="#2f6fd0" fill-opacity="0.12" stroke="#2f6fd0" stroke-width="2"/><text x="268" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2430">Frame 1</text><rect x="384" y="72" width="40" height="40" rx="6" fill="#eef1f5" stroke="#8a8f98" stroke-width="1.25"/><rect x="424" y="72" width="176" height="40" rx="6" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="512" y="97" text-anchor="middle" font-size="13" fill="#1d2430">Frame 2 … up to 8</text><rect x="600" y="72" width="64" height="40" rx="6" fill="#eef1f5" stroke="#8a8f98" stroke-width="1.25"/><text x="632" y="97" text-anchor="middle" font-size="13" fill="#1d2430">Tail</text><text x="404" y="130" text-anchor="middle" font-size="11.5" fill="#5b6472">0.2 s tone</text><text x="88" y="130" text-anchor="middle" font-size="11.5" fill="#5b6472">TX delay, 300–600 ms</text><text x="632" y="130" text-anchor="middle" font-size="11.5" fill="#5b6472">150 ms</text><text x="680" y="97" text-anchor="start" font-size="11.5" fill="#5b6472">tone =</text><text x="680" y="112" text-anchor="start" font-size="11.5" fill="#5b6472">1031.25 Hz</text><g fill="none" stroke="#c9cdd3" stroke-width="1.25" stroke-dasharray="4 4"><path d="M152 112L24 196"/><path d="M384 112L736 196"/></g><text x="24" y="186" text-anchor="start" font-size="11.5" fill="#5b6472">Inside one frame (each symbol 13.3 ms)</text><rect x="24" y="196" width="256" height="56" rx="6" fill="none" stroke="#8a8f98" stroke-width="1.25"/><line x1="88" x2="88" y1="196" y2="206" stroke="#8a8f98"/><line x1="88" x2="88" y1="242" y2="252" stroke="#8a8f98"/><line x1="152" x2="152" y1="196" y2="206" stroke="#8a8f98"/><line x1="152" x2="152" y1="242" y2="252" stroke="#8a8f98"/><line x1="216" x2="216" y1="196" y2="206" stroke="#8a8f98"/><line x1="216" x2="216" y1="242" y2="252" stroke="#8a8f98"/><text x="152" y="221" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2430">Preamble × 4</text><text x="152" y="238" text-anchor="middle" font-size="11.5" fill="#5b6472">known narrow BPSK symbol</text><rect x="280" y="196" width="96" height="56" rx="6" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="328" y="221" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2430">Header</text><text x="328" y="238" text-anchor="middle" font-size="11.5" fill="#5b6472">mode + length</text><rect x="376" y="196" width="120" height="56" rx="6" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="436" y="221" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2430">Training</text><text x="436" y="238" text-anchor="middle" font-size="11.5" fill="#5b6472">Wide modes only</text><rect x="496" y="196" width="240" height="56" rx="6" fill="#2f6fd0" fill-opacity="0.12" stroke="#2f6fd0" stroke-width="2"/><text x="616" y="221" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2430">Data symbols</text><text x="616" y="238" text-anchor="middle" font-size="11.5" fill="#5b6472">coded payload, BPSK to 64-QAM</text><text x="24" y="280" text-anchor="start" font-size="11.5" fill="#5b6472">The receiver finds a frame by the exact 640-sample repetition of the preamble; the header says how to read the rest.</text></svg>